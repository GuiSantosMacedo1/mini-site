<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Página de contato do site sobre o Canadá.">
  <meta name="author" content="Guilherme Santos">
  <link rel="shortcut icon" href="../assets/canada.jpg" type="image/x-icon">
  <link rel="stylesheet" href="contato.css">
  <title>Contato</title>
</head>
<body>
  <header>
    <h1>Canadá</h1>
    <nav>
      <ul>
        <li><a href="../index.html">Home</a></li>
        <li><a href="../sobre/sobre.html">Sobre</a></li>
        <li><a href="../contato/contato.html">Contato</a></li>
      </ul>
    </nav>
  </header>
  <hr class="linha-header">

  <main>
    <section class="contato">
      <div class="contato-inicio">
        <h2 class="contato-titulo">Contato</h2>
        <p class="contato-descricao">Tem alguma dúvida, sugestão ou quer saber mais sobre o Canadá? Preencha o formulário abaixo e envie sua mensagem.</p>
      </div>

      <hr class="linha-separadora">

      <form class="formulario" action="#">
        <h2>Envie sua mensagem</h2>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>

        <label for="assunto">Assunto:</label>
        <input type="text" id="assunto" name="assunto" required>

        <label for="categoria">Categoria:</label>
        <select name="categoria" id="categoria" required>
          <option value="duvida">Dúvida</option>
          <option value="sugestao">Sugestão</option>
          <option value="outro">Outro</option>
        </select>

        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" rows="5" required></textarea>

        <button type="submit">Enviar Mensagem</button>
      </form>
    </section>
  </main>
</body>
</html>
